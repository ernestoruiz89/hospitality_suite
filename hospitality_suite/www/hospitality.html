{% extends "templates/web.html" %}
{% block page_content %}
<style>.hp{max-width:720px;margin:45px auto;padding:32px;background:#f5f7f2;border:1px solid #dce5db;border-radius:15px;color:#183c32}.hp h1{font-size:32px}.hp label{font-size:13px;margin-top:15px;display:block}.hp input,.hp select{width:100%;padding:11px;border:1px solid #cdd9ce;border-radius:7px;background:#fff}.hp-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hp button{margin-top:22px;background:#176756;color:#fff;border:0;border-radius:7px;padding:12px 20px}.hp p{line-height:1.7}.hp-status{padding-top:20px;font-weight:600}@media(max-width:600px){.hp{padding:22px;margin:20px 0}.hp-grid{grid-template-columns:1fr}}</style>
<section class="hp"><p>RESERVAS EN LÍNEA</p><h1>Prepare su próxima estancia</h1><p>Consulte disponibilidad y solicite confirmación a recepción. No se realizan cobros en esta página.</p><div id="hp-empty" role="status">Cargando establecimientos…</div><form id="hp-form" hidden><label for="hp-property">Establecimiento</label><select id="hp-property" required></select><label for="hp-category">Categoría</label><select id="hp-category" required></select><div class="hp-grid"><div><label for="hp-start">Entrada</label><input id="hp-start" type="datetime-local" required></div><div><label for="hp-end">Salida</label><input id="hp-end" type="datetime-local" required></div><div><label for="hp-quantity">Habitaciones</label><input id="hp-quantity" type="number" value="1" min="1" max="10" required></div><div><label for="hp-people">Personas por habitación</label><input id="hp-people" type="number" value="1" min="1" max="20" required></div></div><label for="hp-name">Nombre</label><input id="hp-name" maxlength="120" autocomplete="name" required><label for="hp-email">Correo para la confirmación</label><input id="hp-email" type="email" maxlength="140" autocomplete="email" required><label for="hp-phone">Teléfono (opcional)</label><input id="hp-phone" type="tel" autocomplete="tel"><button id="hp-quote" type="submit">Consultar disponibilidad y precio</button><div id="hp-result" class="hp-status" role="status"></div><button id="hp-request" type="button" hidden>Solicitar confirmación</button><p id="hp-zone"></p></form></section>
{% endblock %}
